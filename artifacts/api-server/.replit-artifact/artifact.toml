kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 5000
name = "Telegram Bot"
paths = ["/health", "/run-now", "/telegram-update", "/bot-api"]

[services.development]
run = "cd telegram-webhook-bot && gunicorn --bind 0.0.0.0:5000 app:app --log-level info --timeout 120 --keep-alive 5"

[services.production]

[services.production.build]
args = ["sh", "-c", "pip install --user -r telegram-webhook-bot/requirements.txt"]

[services.production.run]
args = ["sh", "-c", "cd telegram-webhook-bot && python -m gunicorn --bind 0.0.0.0:5000 app:app --log-level info --timeout 120 --keep-alive 5 --workers 1"]

[services.production.health.startup]
path = "/health"
